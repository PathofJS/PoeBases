    function updateSearchSuggestions(query){
      const suggestions = document.getElementById('search-suggestions');
      const input = document.getElementById('search-input');
      const normalizedQuery = query.trim().toLowerCase();
      suggestions.replaceChildren();
      if(!normalizedQuery){
        suggestions.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        return;
      }

      const matches = allItems
        .filter(item => (item.name || '').toLowerCase().includes(normalizedQuery))
        .sort((a, b) => {
          const aStartsWith = (a.name || '').toLowerCase().startsWith(normalizedQuery);
          const bStartsWith = (b.name || '').toLowerCase().startsWith(normalizedQuery);
          return Number(bStartsWith) - Number(aStartsWith) || (a.name || '').localeCompare(b.name || '');
        })
        .slice(0, 12);

      if(matches.length === 0){
        const message = document.createElement('div');
        message.className = 'search-no-results';
        message.setAttribute('role', 'status');
        message.textContent = 'No matches';
        suggestions.appendChild(message);
      }

      for(const item of matches){
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'search-suggestion';
        option.setAttribute('role', 'option');
        option.appendChild(document.createTextNode(item.name || 'Unnamed item'));
        const category = document.createElement('span');
        category.className = 'search-suggestion-category';
        const categoryKey = getItemCategory(item);
        category.textContent = categoryKey === 'Cluster Jewel'
          ? 'Cluster Jewels'
          : getClassLabel(categoryKey, itemClasses[categoryKey] || {});
        option.appendChild(category);
        option.addEventListener('mousedown', event => event.preventDefault());
        option.addEventListener('click', () => selectSearchSuggestion(item));
        suggestions.appendChild(option);
      }

      suggestions.hidden = false;
      input.setAttribute('aria-expanded', 'true');
      positionSearchSuggestions();
    }

    function selectSearchSuggestion(item){
      currentCategory = getItemCategory(item);
      currentModAvailability = categoryModAvailability.get(currentCategory) || 'with';
      document.querySelectorAll('.cat-btn').forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.category === currentCategory &&
            button.dataset.modAvailability === currentModAvailability
        );
      });
      selectedItem = null;
      selectedMods = { prefixes: {}, suffixes: {} };
      document.getElementById('search-input').value = item.name || '';
      syncSearchClearButton();
      closeSearchSuggestions();
      render();

      const matchingRow = Array.from(document.querySelectorAll('#table-results tbody tr'))
        .find(row => row.dataset.itemId === item.id);
      if(matchingRow) matchingRow.click();
    }

    function render(){
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const isClusterJewelCategory = currentCategory === 'Cluster Jewel';
      const categoryName = isClusterJewelCategory ? 'Cluster Jewels' : itemClasses[currentCategory]?.name || currentCategory;
      
      let filtered = allItems.filter(item => {
        const isClusterJewel = item.item_class === 'Jewel' && /cluster jewel/i.test(item.name || '');
        const inCategory = isClusterJewelCategory
          ? isClusterJewel
          : item.item_class === currentCategory && (currentCategory !== 'Jewel' || !isClusterJewel);
        const matchesSearch = (item.name || '').toLowerCase().includes(q) || (item.item_class || '').toLowerCase().includes(q);
        return inCategory && matchesSearch;
      });

      renderTable(filtered, categoryName);
    }

    function getSortValue(item, key){
      const v = item || {};
      if(key.includes('.')){
        const parts = key.split('.');
        let cur = v[parts[0]];
        for(let i=1;i<parts.length;i++){
          if(cur === undefined || cur === null) return '';
          cur = cur[parts[i]];
        }
        return (cur === null || cur === undefined) ? '' : String(cur);
      }
      if(key === 'Name'){
        return (v.name !== undefined && v.name !== null) ? String(v.name) : ((v.Name !== undefined && v.Name !== null) ? String(v.Name) : '');
      }
      const raw = v[key];
      return (raw === null || raw === undefined) ? '' : String(raw);
    }

    function renderTable(filtered, categoryName){
      const results = document.getElementById('table-results');
      results.style.paddingBottom = '0px';
      const critControl = document.getElementById('crit-dps-control');
      critControl.replaceChildren();
      if(filtered.length === 0){ 
        results.innerHTML = '<em>No items</em>'; 
        return; 
      }

      const counts = {};
      for(const item of filtered){ 
        for(const k in item){ 
          if(item[k] !== null && item[k] !== undefined) counts[k] = (counts[k] || 0) + 1; 
        } 
      }
      
      const excluded = new Set(['id','Name','name','domain','Domain','inventory_height','inventory_width','inherits_from','release_state','visual_identity','item_class','tags','charges']);
      const propsAll = Object.keys(counts).filter(k => counts[k] === filtered.length);
      let props = propsAll.filter(k => !excluded.has(k));
      
      // Exclude armor/evasion/energy_shield from weapons; exclude physical_damage from armours
      const isWeapon = weaponClasses.has(currentCategory);
      const isArmour = armourClasses.has(currentCategory);
      const showBlockColumns = currentCategory === 'Shield' ||
        currentCategory === 'Staff' || currentCategory === 'Warstaff';
      const hasWeaponDps = isWeapon && filtered.some(item => calculateWeaponDps(item) !== null);
      const hasWeaponEdps = hasWeaponDps && filtered.some(item => {
        const edpsRange = calculateWeaponElementalDpsRange(item);
        return edpsRange !== null && (edpsRange.min !== 0 || edpsRange.max !== 0);
      });
      if(hasWeaponDps){
        const critStub = document.createElement('div');
        critStub.className = 'control-stub';
        const critStubTitle = document.createElement('span');
        critStubTitle.className = 'control-stub-title';
        critStubTitle.textContent = 'Crit';
        critStub.appendChild(critStubTitle);
        const label = document.createElement('label');
        label.className = includeCritInDps ? 'crit-dps-toggle is-enabled' : 'crit-dps-toggle';
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = includeCritInDps;
        checkbox.addEventListener('change', () => {
          includeCritInDps = checkbox.checked;
          render();
        });
        label.append(checkbox, document.createTextNode(' Use crit chance'));
        critStub.appendChild(label);

        const multiplierControl = document.createElement('label');
        multiplierControl.className = 'crit-multiplier-control';
        const multiplierLabel = document.createElement('span');
        multiplierLabel.textContent = 'Multiplier';
        const multiplierSlider = document.createElement('input');
        multiplierSlider.type = 'range';
        multiplierSlider.min = '150';
        multiplierSlider.max = '1000';
        multiplierSlider.step = '10';
        multiplierSlider.value = String(critMultiplierPercent);
        multiplierSlider.disabled = !includeCritInDps;
        multiplierSlider.setAttribute('aria-label', 'Crit multiplier');
        const multiplierValue = document.createElement('output');
        multiplierValue.textContent = critMultiplierPercent + '%';
        multiplierSlider.addEventListener('input', () => {
          critMultiplierPercent = Number(multiplierSlider.value);
          multiplierValue.textContent = critMultiplierPercent + '%';
          updateVisibleDpsValues(filtered);
        });
        multiplierSlider.addEventListener('change', () => render());
        multiplierControl.append(multiplierLabel, multiplierSlider, multiplierValue);
        critStub.appendChild(multiplierControl);
        critControl.appendChild(critStub);

        const accuracyStub = document.createElement('div');
        accuracyStub.className = enableAccuracy
          ? 'control-stub accuracy-control-stub is-enabled'
          : 'control-stub accuracy-control-stub';
        const accuracyToggle = document.createElement('label');
        accuracyToggle.className = 'accuracy-control';
        const accuracyCheckbox = document.createElement('input');
        accuracyCheckbox.type = 'checkbox';
        accuracyCheckbox.checked = enableAccuracy;
        accuracyCheckbox.setAttribute('aria-label', 'Hit chance');
        accuracyCheckbox.addEventListener('change', () => {
          enableAccuracy = accuracyCheckbox.checked;
          render();
        });
        accuracyToggle.append(accuracyCheckbox, document.createTextNode(' Hit chance'));
        accuracyStub.appendChild(accuracyToggle);
        critControl.appendChild(accuracyStub);

        const accuracySettings = document.createElement('div');
        accuracySettings.className = enableAccuracy ? 'accuracy-settings' : 'accuracy-settings is-disabled';
        accuracySettings.setAttribute('aria-hidden', String(!enableAccuracy));
        const inputs = [
          { key: 'characterLevel', label: 'Level', min: 1, max: 100, value: characterLevel },
          { key: 'characterDexterity', label: 'Dex', min: 0, max: 1000, value: characterDexterity },
          { key: 'monsterLevel', label: 'Monster', min: 1, max: 100, value: monsterLevel },
          { key: 'accuracyOverride', label: 'Accuracy', min: 0, max: 1000000, value: accuracyOverride, optional: true, placeholder: 'auto' },
          { key: 'evasionOverride', label: 'Evasion', min: 0, max: 1000000, value: evasionOverride, optional: true, placeholder: 'auto' }
        ];
        for(const setting of inputs){
          const control = document.createElement('label');
          control.appendChild(document.createTextNode(setting.label));
          const input = document.createElement('input');
          input.type = 'number';
          input.min = String(setting.min);
          input.max = String(setting.max);
          input.step = '1';
          input.value = setting.value === null ? '' : String(setting.value);
          input.disabled = !enableAccuracy;
          input.setAttribute('aria-label', setting.label);
          if(setting.optional){
            input.placeholder = setting.placeholder;
            input.className = 'accuracy-override';
          }
          input.addEventListener('input', () => {
            const value = input.value === '' ? null : Math.min(
              setting.max,
              Math.max(setting.min, Number(input.value) || 0)
            );
            if(setting.key === 'characterLevel' && value !== null){
              characterLevel = value;
            } else if(setting.key === 'characterDexterity'){
              characterDexterity = value === null ? 0 : value;
            } else if(setting.key === 'monsterLevel' && value !== null){
              monsterLevel = value;
            } else if(setting.key === 'accuracyOverride'){
              accuracyOverride = value;
            } else if(setting.key === 'evasionOverride'){
              evasionOverride = value;
            }
            updateVisibleDpsValues(filtered);
          });
          input.addEventListener('change', () => render());
          control.appendChild(input);
          accuracySettings.appendChild(control);
        }
        accuracyStub.appendChild(accuracySettings);
      }
      
      if(isWeapon){
        props = props.filter(k => !['armour','armor','evasion','energy_shield'].includes(k));
      }
      if(isArmour){
        props = props.filter(k => k !== 'physical_damage');
      }
      
      // move `energy_shield` and `evasion` to immediately follow `armor`/`armour` when present
      (function(){
        const moveAfter = ['energy_shield','evasion'];
        const anchors = ['armor','armour'];
        let anchor = null; let anchorIdx = -1;
        for(const a of anchors){ const i = props.indexOf(a); if(i !== -1){ anchor = a; anchorIdx = i; break; } }
        if(anchorIdx !== -1){
          const toMove = [];
          for(const m of moveAfter){ const i = props.indexOf(m); if(i !== -1){ toMove.push(m); props.splice(i,1); } }
          props.splice(anchorIdx+1, 0, ...toMove);
        } else {
          for(const m of moveAfter){ const i = props.indexOf(m); if(i !== -1){ props.splice(i,1); props.push(m); } }
        }
      })();
      
      // move Requirements to immediately follow Drop_Level when present
      (function(){
        const item = 'requirements';
        const anchor = 'drop_level';
        const iReq = props.indexOf(item);
        const iDrop = props.indexOf(anchor);
        if(iReq !== -1 && iDrop !== -1){
          props.splice(iReq, 1);
          const newIdx = props.indexOf(anchor) + 1;
          props.splice(newIdx, 0, item);
        }
      })();

      // move Implicits to immediately follow properties when present
      (function(){
        const item = 'implicits';
        const anchor = 'properties';
        const iIt = props.indexOf(item);
        const iProp = props.indexOf(anchor);
        if(iIt !== -1 && iProp !== -1){
          props.splice(iIt, 1);
          const newIdx = props.indexOf(anchor) + 1;
          props.splice(newIdx, 0, item);
        }
      })();

      if(hasWeaponDps && enableAccuracy){
        const implicitIndex = props.indexOf('implicits');
        const insertIndex = implicitIndex === -1
          ? props.indexOf('properties') + 1
          : implicitIndex + 1;
        if(insertIndex > 0) props.splice(insertIndex, 0, 'accuracy_rating', 'hit_chance');
      }

      const hdr = ['name', ...props];

      // prepare expanded subcolumns for certain complex fields
      const expandKeys = new Set(['properties','requirements']);
      const subcols = {}; 
      const subsub = {}; 
      for(const k of hdr){ if(expandKeys.has(k)) { subcols[k] = new Set(); subsub[k] = {}; } }
      for(const item of filtered){ 
        if(subcols.properties && item.properties && typeof item.properties === 'object'){
          Object.keys(item.properties).forEach(s=>{
            const val = item.properties[s];
            if(val && typeof val === 'object'){
              const leaves = Object.keys(val).filter(ss => hasDisplayValue(val[ss], 'properties'));
              if(leaves.length === 0) return;
              subcols.properties.add(s);
              subsub.properties[s] = subsub.properties[s] || new Set();
              leaves.forEach(ss=>subsub.properties[s].add(ss));
            } else if(hasDisplayValue(val, 'properties')){
              subcols.properties.add(s);
            }
          });
        }
        if(subcols.requirements && item.requirements && typeof item.requirements === 'object'){
          Object.keys(item.requirements).forEach(s=>{
            const val = item.requirements[s];
            if(val && typeof val === 'object'){
              const leaves = Object.keys(val).filter(ss => hasDisplayValue(val[ss], 'requirements'));
              if(leaves.length === 0) return;
              subcols.requirements.add(s);
              subsub.requirements[s] = subsub.requirements[s] || new Set();
              leaves.forEach(ss=>subsub.requirements[s].add(ss));
            } else if(hasDisplayValue(val, 'requirements')){
              subcols.requirements.add(s);
            }
          });
        }
      }
      
      // convert to arrays and sort for stable order
      for(const k in subcols){
        let origList = Array.from(subcols[k]).sort();
        const origMap = subsub[k] || {};
        if(k === 'properties'){
          const removeProps = new Set(['charges_per_use','cooldown_ms','description','directions','duration','charges','full_stack_turns_into','life_per_use','mana_burn_ms','mana_per_use','monster_ability_text','monster_category','monster_id','movement_speed','stack_size','stack_size_currency_tab']);
          origList = origList.filter(n => !removeProps.has(n) && !/^charges/.test(n));
          if(!filtered.some(item => {
            const ward = item.properties && item.properties.ward;
            return ward !== null && ward !== undefined && ward !== '';
          })){
            origList = origList.filter(n => n !== 'ward');
          }
          if(isArmour){
            origList = origList.filter(n => n !== 'range' && n !== 'attack_time' && n !== 'critical_strike_chance' && !/^physical_damage/.test(n));
            origList = origList.filter(n => n !== 'block');
          }
          if(isWeapon){
            origList = origList.filter(n => ['armour','energy_shield','evasion','block'].indexOf(n) === -1);
            if(hasSelectedLocalChaosDamage()){
              origList.push('chaos_damage_min', 'chaos_damage_max');
            }
            if(hasWeaponDps){
              origList.push('dps');
              if(hasWeaponEdps) origList.push('edps');
            }
          }
          if(showBlockColumns){
            origList.push('attack_block', 'spell_block');
          }
        }
        const map = {};

        if(k === 'properties'){
          const combined = [];
          const used = new Set();
          for(const name of origList){
            const m = name.match(/^(.*)_(min|max)$/);
            if(m){
              const base = m[1];
              if(used.has(base)) continue;
              if(origList.indexOf(base + '_min') !== -1 || origList.indexOf(base + '_max') !== -1){
                combined.push(base);
                used.add(base);
              } else {
                combined.push(name);
              }
            } else {
              combined.push(name);
            }
          }
          for(const name of origList){
            const mm = name.match(/^(.*)_(min|max)$/);
            if(mm){
              const base = mm[1];
              const leaf = mm[2];
              map[base] = map[base] || [];
              if(map[base].indexOf(leaf) === -1) map[base].push(leaf);
            }
          }
          for(const s in origMap){
            const arr = Array.from(origMap[s] || []);
            if(arr.length){
              map[s] = map[s] || [];
              for(const leaf of arr){ if(map[s].indexOf(leaf) === -1) map[s].push(leaf); }
            }
          }
          for(const s in map){
            map[s].sort((a,b)=>{ const pref = ['min','max']; const ai = pref.indexOf(a.toLowerCase()); const bi = pref.indexOf(b.toLowerCase()); if(ai !== -1 && bi !== -1) return ai-bi; if(ai !== -1) return -1; if(bi !== -1) return 1; return a.localeCompare(b); });
          }
          subcols[k] = combined;
          subsub[k] = map;
        } else {
          subcols[k] = origList;
          for(const s in origMap){
            const arr = Array.from(origMap[s] || []);
            arr.sort((a,b)=>{
              const pref = ['min','max'];
              const ai = pref.indexOf(a.toLowerCase());
              const bi = pref.indexOf(b.toLowerCase());
              if(ai !== -1 && bi !== -1) return ai - bi;
              if(ai !== -1) return -1;
              if(bi !== -1) return 1;
              return a.localeCompare(b);
            });
            map[s] = arr;
          }
          subsub[k] = map;
        }
      }

      let needThird = false;
      for(const k in subsub){
        if(k === 'properties') continue;
        const map = subsub[k] || {};
        for(const s in map){ if((map[s] || []).length > 0) { needThird = true; break; } }
        if(needThird) break;
      }

      const injectAfterProperty = 'armour';
      const desiredInject = ['energy_shield','evasion'];
      const injectKeys = [];
      for(const m of desiredInject){ const i = props.indexOf(m); if(i !== -1){ injectKeys.push(m); props.splice(i,1); } }

      const expandedSubcols = {};
      for(const k in subcols){
        if(k === 'properties'){
          const desiredOrder = ['armour','energy_shield','evasion','block','attack_block','spell_block','attack_time','critical_strike_chance','physical_damage','chaos_damage','dps','edps','range','charges_max'];
          const baseSet = new Set(subcols[k] || []);
          const list = [];
          for(const name of desiredOrder){ if(baseSet.has(name) || injectKeys.indexOf(name) !== -1){ list.push(name); } }
          for(const sc of subcols[k]){ if(list.indexOf(sc) === -1) list.push(sc); }
          expandedSubcols[k] = list;
        } else if(k === 'requirements'){
          const desiredReq = ['level','dexterity','intelligence','strength'];
          const baseSetReq = new Set(subcols[k] || []);
          const reqList = [];
          for(const name of desiredReq){ if(baseSetReq.has(name)) reqList.push(name); }
          for(const sc of subcols[k]){ if(reqList.indexOf(sc) === -1) reqList.push(sc); }
          expandedSubcols[k] = reqList;
        } else {
          expandedSubcols[k] = subcols[k];
        }
      }

      // Build headers with sorting
      const currentSortKey = sortKey;
      const currentSortDir = sortDir;
      const sortIndicator = currentSortDir === 1 ? ' ▲' : ' ▼';
      
      const firstCells = [];
      const secondCells = [];
      const thirdCells = [];
      for(const h of hdr){
        if(subcols[h] && subcols[h].length){
          let leafCount = 0;
          const scs = expandedSubcols[h] || subcols[h];
          for(const sc of scs){ const leaves = (subsub[h] && subsub[h][sc]) ? subsub[h][sc].length : 0; leafCount += (leaves>0? leaves : 1); }
          if(h !== 'properties'){
            firstCells.push('<th colspan="'+leafCount+'" class="maincol">'+prettyHeaderHtml(h)+'</th>');
          }
          for(const sc of scs){
            const leaves = (subsub[h] && subsub[h][sc]) ? subsub[h][sc] : [];
            const headerNameMap = { dexterity: 'Dex', intelligence: 'Int', strength: 'Str' };
            const displayName = (h === 'requirements' && headerNameMap[sc]) ? headerNameMap[sc] : prettyHeader(sc);
            if(h === 'properties'){
              const key = h + '.' + sc;
              const critDpsHeaderClass = includeCritInDps &&
                (sc === 'dps' || sc === 'edps' || sc === 'critical_strike_chance')
                ? ' crit-dps-header is-enabled'
                : '';
              if(leaves.length){
                firstCells.push('<th colspan="'+leaves.length+'" class="maincol">'+escapeHtml(displayName).replace(/ (?=[A-Za-z(])/g, '<br>')+'</th>');
                for(const leaf of leaves){
                  const leafKey = key + '.' + leaf;
                  secondCells.push('<th data-key="'+escapeHtml(leafKey)+'" class="sortable" style="cursor:pointer">'+renderSortableHeaderHtml(escapeHtml(leaf.charAt(0).toUpperCase()+leaf.slice(1)), currentSortKey===leafKey, sortIndicator) +'</th>');
                }
              } else {
                firstCells.push('<th rowspan="'+(needThird?3:2)+'" data-key="'+escapeHtml(key)+'" class="sortable'+critDpsHeaderClass+'" style="cursor:pointer">'+renderSortableHeaderHtml(escapeHtml(displayName).replace(/ (?=[A-Za-z(])/g, '<br>'), currentSortKey===key, sortIndicator)+'</th>');
              }
            } else if(leaves.length){
              secondCells.push('<th colspan="'+leaves.length+'">'+escapeHtml(displayName).replace(/ (?=[A-Za-z(])/g, '<br>')+'</th>');
              for(const leaf of leaves){ const key = h + '.' + sc + '.' + leaf; thirdCells.push('<th data-key="'+escapeHtml(key)+'" class="sortable" style="cursor:pointer">'+renderSortableHeaderHtml(escapeHtml(leaf.charAt(0).toUpperCase()+leaf.slice(1)), currentSortKey===key, sortIndicator) +'</th>'); }
            } else {
              const key = h + '.' + sc;
              const critDpsHeaderClass = includeCritInDps && h === 'properties' &&
                (sc === 'dps' || sc === 'edps' || sc === 'critical_strike_chance')
                ? ' crit-dps-header is-enabled'
                : '';
              secondCells.push('<th rowspan="'+(needThird?2:1)+'" data-key="'+escapeHtml(key)+'" class="sortable'+critDpsHeaderClass+'" style="cursor:pointer">'+renderSortableHeaderHtml(escapeHtml(displayName).replace(/ (?=[A-Za-z(])/g, '<br>'), currentSortKey===key, sortIndicator) +'</th>');
            }
          }
        } else {
          const rowspan = needThird ? 3 : 2;
          const key = h === 'accuracy_rating' || h === 'hit_chance'
            ? 'properties.' + h
            : h;
          firstCells.push('<th rowspan="'+rowspan+'" data-key="'+escapeHtml(key)+'" class="sortable" style="cursor:pointer">'+renderSortableHeaderHtml(prettyHeaderHtml(h), currentSortKey===key, sortIndicator) +'</th>');
        }
      }
      
      let headerHtml = '<table class="results"><thead>' + '<tr>' + firstCells.join('') + '</tr>';
      if(secondCells.length) headerHtml += '<tr>' + secondCells.join('') + '</tr>';
      if(thirdCells.length) headerHtml += '<tr>' + thirdCells.join('') + '</tr>';
      headerHtml += '</thead><tbody>';

      const getSortValue = (item, key) => {
        if(key === 'properties.attack_block' || key === 'properties.spell_block'){
          const blockType = key.slice('properties.'.length);
          const blockRange = getBlockChanceRange(item, blockType);
          return blockRange ? String(blockRange.max) : '';
        }
        if(key === 'properties.accuracy_rating'){
          return String(getWeaponAccuracyInfo(item).maxAccuracy);
        }
        if(key === 'properties.hit_chance'){
          return String(getWeaponAccuracyInfo(item).maxChance * 100);
        }
        if(key === 'properties.dps'){
          const dps = calculateWeaponDps(item);
          return dps === null ? '' : String(dps);
        }
        if(key === 'properties.edps'){
          const dps = calculateWeaponElementalDpsRange(item);
          return dps === null ? '' : String(Math.max(dps.min, dps.max));
        }
        if(key === 'properties.critical_strike_chance'){
          const rawCritChance = item.properties && item.properties.critical_strike_chance;
          if(rawCritChance === null || rawCritChance === undefined || rawCritChance === '') return '';
          const formattedCritChance = applyModsToFormattedValue(
            item,
            'critical_strike_chance',
            formatPropertyValue('critical_strike_chance', rawCritChance)
          );
          const displayInfo = getCritChanceDisplayInfo(item, formattedCritChance);
          return displayInfo ? String((displayInfo.adjustedMin + displayInfo.adjustedMax) / 2) : '';
        }
        if(key.includes('.')){
          const parts = key.split('.');
          let cur = item[parts[0]];
          for(let i=1;i<parts.length;i++){
            if(cur === undefined || cur === null){
              if(parts[0] === 'properties' && parts.length === 3){
                const propName = parts[1] + '_' + parts[2];
                const tryVal = (item.properties && (item.properties[propName] !== undefined && item.properties[propName] !== null)) ? item.properties[propName] : undefined;
                return (tryVal === null || tryVal === undefined) ? '' : String(tryVal);
              }
              return '';
            }
            cur = cur[parts[i]];
          }
          return (cur === null || cur === undefined) ? '' : String(cur);
        }
        if(key === 'name'){
          return (item.name !== undefined && item.name !== null) ? String(item.name) : '';
        }
        if(key === 'properties'){
          try{ return JSON.stringify(item.properties || ''); }catch(e){ return String(item.properties || ''); }
        }
        if(key === 'implicits'){
          const val = item[key];
          if(Array.isArray(val)) return val.join(', ');
          if(typeof val === 'string' && val.startsWith('[') && val.endsWith(']')){
            try{ const p = JSON.parse(val); if(Array.isArray(p)) return p.join(', '); }catch(e){}
            return val.slice(1,-1).trim();
          }
          return (val === null || val === undefined) ? '' : String(val);
        }
        const raw = item[key];
        return (raw === null || raw === undefined) ? '' : String(raw);
      };
      
      if(currentSortKey){
        filtered.sort((a,b)=>{
          const A = getSortValue(a, currentSortKey);
          const B = getSortValue(b, currentSortKey);
          const nA = Number(A); const nB = Number(B);
          if(!isNaN(nA) && !isNaN(nB)) return (nA - nB) * currentSortDir;
          return A.localeCompare(B) * currentSortDir;
        });
      }

      let rows = '';
      for(const item of filtered){
        const isSelected = selectedItem && selectedItem.id === item.id;
        const cells = [];
        const nameVal = (item.name !== undefined && item.name !== null) ? item.name : '';
        cells.push('<td class="small">' + escapeHtml(formatValue(nameVal)) + '</td>');
        for(const k of props){
          if(k === 'accuracy_rating'){
            cells.push('<td class="small" data-key="properties.accuracy_rating">' + formatWeaponAccuracy(item) + '</td>');
          } else if(k === 'hit_chance'){
            cells.push('<td class="small" data-key="properties.hit_chance">' + formatHitChance(item) + '</td>');
          } else if(subcols[k] && subcols[k].length){
            const scs = expandedSubcols[k] || subcols[k];
            for(const sc of scs){
              const leaves = (subsub[k] && subsub[k][sc]) ? subsub[k][sc] : [];
              if(leaves && leaves.length){
                const nested = (item[k] && typeof item[k] === 'object') ? item[k][sc] : undefined;
                if(nested && typeof nested === 'object'){
                  for(const leaf of leaves){
                    const val = nested[leaf];
                    const out = formatPropertyValue(sc, val);
                    cells.push('<td class="small">' + escapeHtml(formatTableCellValue(val, k, out)) + '</td>');
                  }
                } else if(k === 'properties'){
                  if(item.properties && item.properties[sc] !== undefined && (item.properties[sc] === null || typeof item.properties[sc] !== 'object')){
                    const baseVal = item.properties[sc];
                    const outBase = formatPropertyValue(sc, baseVal);
                    for(const leaf of leaves){
                      cells.push('<td class="small">' + escapeHtml(formatValue(outBase)) + '</td>');
                    }
                  } else {
                    for(const leaf of leaves){
                      const keyName = sc + '_' + leaf;
                      const val = (item.properties && (item.properties[keyName] !== undefined)) ? item.properties[keyName] : undefined;
                      if(sc === 'physical_damage' && (leaf === 'min' || leaf === 'max')){
                        cells.push('<td class="small">' + formatModifiedPhysicalDamage(item, leaf, val) + '</td>');
                        continue;
                      }
                      if(sc === 'chaos_damage' && (leaf === 'min' || leaf === 'max')){
                        cells.push('<td class="small">' + formatSelectedLocalChaosDamage(item, leaf) + '</td>');
                        continue;
                      }
                      let out = formatPropertyValue(sc, val);
                      // Apply formatted mods (for attack speed) - use sc as property name
                      out = applyModsToFormattedValue(item, sc, out);
                      cells.push('<td class="small">' + escapeHtml(formatValue(out)) + '</td>');
                    }
                  }
                } else {
                  for(const leaf of leaves){
                    const obj = (item[k] && typeof item[k] === 'object') ? item[k][sc] : undefined;
                    const val = (obj && typeof obj === 'object') ? obj[leaf] : undefined;
                    let out = formatPropertyValue(sc, val);
                    out = applyModsToFormattedValue(item, sc, out);
                    cells.push('<td class="small">' + escapeHtml(formatTableCellValue(val, k, out)) + '</td>');
                  }
                }
              } else {
                if(k === 'properties' && injectKeys.indexOf(sc) !== -1){
                  const val = item[sc];
                  let out = formatPropertyValue(sc, val);
                  out = applyModsToFormattedValue(item, sc, out);
                  cells.push('<td class="small">' + escapeHtml(formatValue(out)) + '</td>');
                } else if(k === 'properties' && (sc === 'attack_block' || sc === 'spell_block')){
                  cells.push('<td class="small">' + formatBlockChance(item, sc) + '</td>');
                } else if(k === 'properties' && sc === 'dps'){
                  const dpsValueClass = includeCritInDps ? 'small crit-dps-value is-enabled' : 'small';
                  cells.push('<td class="' + dpsValueClass + '" data-key="properties.dps">' + formatWeaponDps(item) + '</td>');
                } else if(k === 'properties' && sc === 'edps'){
                  const dpsValueClass = includeCritInDps ? 'small crit-dps-value is-enabled' : 'small';
                  cells.push('<td class="' + dpsValueClass + '" data-key="properties.edps">' + formatWeaponElementalDps(item) + '</td>');
                } else {
                  const obj = item[k] || {};
                  const val = (obj && typeof obj === 'object') ? obj[sc] : undefined;
                  let out = formatPropertyValue(sc, val);
                  out = applyModsToFormattedValue(item, sc, out);
                  const formattedCell = k === 'properties' && sc === 'critical_strike_chance'
                    ? formatCritChanceWithLocalImplicit(item, out)
                    : escapeHtml(formatTableCellValue(val, k, out));
                  const critChanceClass = k === 'properties' && sc === 'critical_strike_chance'
                    ? (includeCritInDps ? ' small crit-dps-value is-enabled' : ' small crit-dps-value')
                    : ' small';
                  cells.push('<td class="' + critChanceClass.trim() + '">' + formattedCell + '</td>');
                }
              }
            }
          } else {
            if(k === 'properties' && item.properties && typeof item.properties === 'object'){
              const inner = [];
              for(const pk in item.properties){
                const pv = item.properties[pk];
                if(pv !== null && pv !== undefined){
                  const out = formatPropertyValue(pk, pv);
                  inner.push('<div><strong>' + escapeHtml(pk) + ':</strong> ' + escapeHtml(formatValue(out)) + '</div>');
                }
              }
              cells.push('<td class="small">' + inner.join('') + '</td>');
            } else if (k === 'implicits') {
              const implicitIds = getImplicitIds(item);
              const implicitTexts = implicitIds.map(implicitId => {
                const text = getImplicitText(implicitId);
                const isCritRelated = weaponClasses.has(item.item_class) &&
                  hasCritRelatedImplicit(implicitId);
                const escapedText = escapeHtml(formatValue(text));
                return isCritRelated
                  ? '<span class="range-highlight">' + escapedText + '</span>'
                  : escapedText;
              });
              cells.push('<td class="small">' + implicitTexts.join(', ') + '</td>');
            } else {
              const cellValue = k === 'release_state'
                ? formatReleaseState(item[k])
                : formatValue(item[k]);
              cells.push('<td class="small">' + escapeHtml(cellValue) + '</td>');
            }
          }
        }
        rows += '<tr class="'+(isSelected ? 'selected' : '')+'" data-item-id="'+escapeHtml(item.id)+'">' + cells.join('') + '</tr>';
      }
      
      results.innerHTML = headerHtml + rows + '</tbody></table>';

      // Insert title row
      const tableEl = results.querySelector('table.results');
      if(tableEl && tableEl.tHead){
        try{
          let totalCols = 0;
          if(tableEl.tBodies && tableEl.tBodies[0] && tableEl.tBodies[0].rows && tableEl.tBodies[0].rows.length > 0){
            totalCols = tableEl.tBodies[0].rows[0].cells.length;
          } else {
            const lastHeaderRow = tableEl.tHead.rows[tableEl.tHead.rows.length - 1];
            for(const cell of Array.from(lastHeaderRow.cells)){
              const cs = parseInt(cell.getAttribute('colspan')) || cell.colSpan || 1;
              totalCols += cs;
            }
          }
          if(totalCols <= 0) totalCols = 1;
          const titleRow = tableEl.tHead.insertRow(0);
          const th = document.createElement('th');
          th.colSpan = totalCols;
          th.className = 'table-title';
          th.textContent = categoryName;
          titleRow.appendChild(th);
          // compute and assign exact sticky top offsets for each header row
          try{
            const headRows = Array.from(tableEl.tHead.rows);
            let cum = 0;
            for(let r = 0; r < headRows.length; r++){
              const row = headRows[r];
              const cells = Array.from(row.cells || []);
              cells.forEach(cell => {
                cell.style.position = 'sticky';
                cell.style.top = cum + 'px';
                cell.style.zIndex = (120 - r).toString();
              });
              cum += row.offsetHeight || 36;
            }
            if(headRows.length > 1){ Array.from(headRows[1].cells).forEach(c => c.classList.add('maincolshadow')); }
          }catch(e){}
        }catch(e){}
      }

      // attach click handlers to header cells for sorting
      const ths = results.querySelectorAll('table.results thead th.sortable');
      ths.forEach(th=>{
        th.addEventListener('click', ()=>{
          const key = th.dataset.key;
          if(sortKey === key) sortDir = -sortDir;
          else { sortKey = key; sortDir = -1; }
          render();
        });
      });

      // attach row click handlers
      document.querySelectorAll('#table-results table.results tbody tr').forEach(row => {
        row.addEventListener('click', () => {
          const itemId = row.dataset.itemId;
          const nextItem = allItems.find(i => i.id === itemId);
          if(!nextItem) return;
          retainModsAvailableForItem(nextItem);
          selectedItem = nextItem;
          render();
          renderMods();
          renderSelectedModsPanel();
          renderModCalculations();
        });
      });
    }

    function retainModsAvailableForItem(item){
      const baseRecord = modsByBaseId.get(item.id.toLowerCase());
      if(!baseRecord){
        throw new Error('No mods_by_base record found for selected base: ' + item.id);
      }

      const availableModIds = new Set();
      for(const generationType of ['prefix', 'suffix']){
        const groups = baseRecord.record.mods?.[generationType] || {};
        for(const modIds of Object.values(groups)){
          for(const modId of Object.keys(modIds)){
            availableModIds.add(modId);
          }
        }
      }

      for(const typeKey of ['prefixes', 'suffixes']){
        for(const [modType, mod] of Object.entries(selectedMods[typeKey])){
          if(!availableModIds.has(mod.id)){
            delete selectedMods[typeKey][modType];
          }
        }
      }
    }

    function getModGroupKey(mod){
      return mod.type || mod.name || mod.id || '';
    }

    function getModLocality(mods){
      const flags = mods.flatMap(mod =>
        (mod.stats || []).map(stat => statDefinitionsById.get(stat.id)?.is_local)
      );
      if(flags.length === 0 || flags.some(flag => typeof flag !== 'boolean')){
        return {key:'unknown', label:'LOCALITY UNKNOWN'};
      }
      if(flags.every(Boolean)) return {key:'local', label:'LOCAL'};
      if(flags.every(flag => !flag)) return {key:'global', label:'GLOBAL'};
      return {key:'mixed', label:'MIXED'};
    }

    function renderModLocality(mods){
      const locality = getModLocality(Array.isArray(mods) ? mods : [mods]);
      return '<span class="mod-locality" data-locality="' + locality.key +
        '">' + locality.label + '</span>';
    }

    function getModGroupStateKey(itemId, sectionTitle, modType){
      return JSON.stringify([itemId, sectionTitle, modType]);
    }

    function filterModsByTags(modEntries, selectedTags, tagsByModType){
      if(selectedTags.size === 0) return modEntries;
      return modEntries.filter(({mod}) =>
        Array.from(selectedTags).every(tag =>
          (tagsByModType.get(getModGroupKey(mod)) || new Set()).has(tag)
        )
      );
    }

    function getCompatibleModTags(tagsByModType, selectedTags){
      const compatibleTags = new Set();
      for(const tags of tagsByModType.values()){
        if(Array.from(selectedTags).every(tag => tags.has(tag))){
          for(const tag of tags) compatibleTags.add(tag);
        }
      }
      return compatibleTags;
    }

    function sortModTagOptions(tagTypeCounts, tagsByModType){
      const remaining = new Set(tagTypeCounts.keys());
      const orderedTags = [];
      const compareTags = (a, b) =>
        (tagTypeCounts.get(b) || 0) - (tagTypeCounts.get(a) || 0) || a.localeCompare(b);

      while(remaining.size > 0){
        const anchor = Array.from(remaining).sort(compareTags)[0];
        remaining.delete(anchor);
        orderedTags.push(anchor);

        const relatedTagCounts = new Map();
        for(const tags of tagsByModType.values()){
          if(!tags.has(anchor)) continue;
          for(const tag of tags){
            if(remaining.has(tag)){
              relatedTagCounts.set(tag, (relatedTagCounts.get(tag) || 0) + 1);
            }
          }
        }
        const relatedTags = Array.from(relatedTagCounts.keys()).sort((a, b) =>
          relatedTagCounts.get(b) / (tagTypeCounts.get(b) || 1) -
            relatedTagCounts.get(a) / (tagTypeCounts.get(a) || 1) ||
          relatedTagCounts.get(b) - relatedTagCounts.get(a) ||
          compareTags(a, b)
        );
        for(const tag of relatedTags){
          remaining.delete(tag);
          orderedTags.push(tag);
        }
      }

      return orderedTags.map(tag => [tag, tagTypeCounts.get(tag)]);
    }

    function hasPositiveModWeightTag(mod, tag){
      return ['spawn_weights', 'generation_weights'].some(field =>
        (mod[field] || []).some(weight => weight.tag === tag && weight.weight > 0)
      );
    }

    function getClusterSubtypeModifiers(jewel, passive, baseMods){
      const subtypeTags = new Set(jewel.passive_skills.map(entry => entry.tag));
      const modifiers = new Map();
      for(const {mod} of baseMods){
        const hasSubtypeWeight = Array.from(subtypeTags).some(tag => hasPositiveModWeightTag(mod, tag));
        if(!hasSubtypeWeight || hasPositiveModWeightTag(mod, passive.tag)){
          modifiers.set(mod.id, mod);
        }
      }
      for(const mod of allMods){
        if(['prefix', 'suffix'].includes(mod.generation_type) &&
           hasPositiveModWeightTag(mod, passive.tag)){
          modifiers.set(mod.id, mod);
        }
      }
      return Array.from(modifiers.values()).map(mod => ({mod}));
    }

    function indexModsByBase(modsByBase, baseItemIds, modsById){
      const byBaseId = new Map();
      for(const [itemClass, conditions] of Object.entries(modsByBase)){
        for(const [condition, record] of Object.entries(conditions)){
          for(const baseId of record.bases || []){
            const key = baseId.toLowerCase();
            if(byBaseId.has(key)){
              throw new Error('Base appears in multiple mods_by_base records: ' + baseId);
            }
            byBaseId.set(key, {itemClass, condition, record});
          }
        }
      }

      for(const baseId of baseItemIds){
        if(!byBaseId.has(baseId.toLowerCase())){
          throw new Error('No mods_by_base record found for base: ' + baseId);
        }
      }
      if(byBaseId.size !== baseItemIds.length){
        throw new Error('mods_by_base base count does not match base_items.json');
      }

      for(const {record} of byBaseId.values()){
        for(const generationType of ['prefix', 'suffix']){
          const groups = record.mods?.[generationType] || {};
          for(const modIds of Object.values(groups)){
            for(const modId of Object.keys(modIds)){
              const mod = modsById.get(modId);
              if(!mod){
                throw new Error('mods_by_base references an unknown mod: ' + modId);
              }
              if(mod.generation_type !== generationType){
                throw new Error('Modifier generation type mismatch for mod: ' + modId);
              }
            }
          }
        }
      }
      return byBaseId;
    }

    function renderMods(){
      if(!selectedItem){
        document.getElementById('mods-title').textContent = '';
        document.getElementById('mods-container').replaceChildren();
        return;
      }

      document.querySelectorAll('.mod-group-header').forEach(header => {
        const content = document.getElementById(header.dataset.groupId);
        if(content){
          openModGroups.set(
            getModGroupStateKey(header.dataset.baseId, header.dataset.sectionTitle, header.dataset.modType),
            content.style.display !== 'none'
          );
        }
      });
      document.getElementById('mods-title').textContent = escapeHtml(selectedItem.name || 'Unknown');
      const selectionNotice = document.getElementById('mod-selection-notice');
      selectionNotice.hidden = true;
      selectionNotice.textContent = '';
      if(!itemsWithMods.has(selectedItem.id.toLowerCase())){
        document.getElementById('mods-container').innerHTML = '<div class="no-mods">No modifiers</div>';
        return;
      }

      const baseRecord = modsByBaseId.get(selectedItem.id.toLowerCase());
      if(!baseRecord){
        throw new Error('No mods_by_base record found for selected base: ' + selectedItem.id);
      }
      if(clusterSubtypeBaseId !== selectedItem.id){
        clusterSubtypeBaseId = selectedItem.id;
        activeClusterSubtypeId = null;
      }
      if(modTagFilterBaseId !== selectedItem.id){
        activeModTagFilters.clear();
        modTagFilterBaseId = selectedItem.id;
      }
      let matchedMods = [];

      for(const generationType of ['prefix', 'suffix']){
        const groups = baseRecord.record.mods?.[generationType] || {};
        for(const modIds of Object.values(groups)){
          for(const modId of Object.keys(modIds)){
            const mod = modsById.get(modId);
            if(!mod){
              throw new Error('mods_by_base references an unknown mod: ' + modId);
            }
            matchedMods.push({mod});
          }
        }
      }

      const clusterJewel = clusterJewelsByBaseId.get(selectedItem.id.toLowerCase());
      const selectedClusterSubtype = clusterJewel?.passive_skills.find(entry => entry.id === activeClusterSubtypeId);
      if(selectedClusterSubtype){
        matchedMods = getClusterSubtypeModifiers(clusterJewel, selectedClusterSubtype, matchedMods);
      } else if(clusterJewel){
        activeClusterSubtypeId = null;
      }

      const tagsByModType = new Map();
      for(const {mod} of matchedMods){
        const modType = getModGroupKey(mod);
        if(!tagsByModType.has(modType)) tagsByModType.set(modType, new Set());
        for(const tag of Array.isArray(mod.implicit_tags) ? mod.implicit_tags : []){
          tagsByModType.get(modType).add(tag);
        }
      }
      const tagTypeCounts = new Map();
      for(const tags of tagsByModType.values()){
        for(const tag of tags){
          tagTypeCounts.set(tag, (tagTypeCounts.get(tag) || 0) + 1);
        }
      }
      const modTagOptions = sortModTagOptions(tagTypeCounts, tagsByModType);
      const compatibleModTags = getCompatibleModTags(tagsByModType, activeModTagFilters);
      const visibleMods = filterModsByTags(matchedMods, activeModTagFilters, tagsByModType);
      const clusterSubtypeHtml = clusterJewel
        ? '<div class="cluster-subtype-control">' +
          '<span class="cluster-subtype-label">Small passive</span>' +
          '<div class="cluster-subtype-options" role="group" aria-label="Guaranteed cluster jewel subtypes">' +
          clusterJewel.passive_skills.map(entry =>
            '<button class="cluster-subtype-toggle" type="button" data-cluster-subtype="' +
            escapeHtml(entry.id) + '" aria-pressed="' + (entry.id === activeClusterSubtypeId) + '">' +
            escapeHtml(entry.name) + '</button>'
          ).join('') +
          '</div></div>'
        : '';

      // Separate mods into prefixes and suffixes
      const prefixMods = visibleMods.filter(e => e.mod.generation_type === 'prefix');
      const suffixMods = visibleMods.filter(e => e.mod.generation_type === 'suffix');
      if(activeModTagFilters.size > 0){
        if(activeModTab === 'prefixes' && prefixMods.length === 0 && suffixMods.length > 0){
          activeModTab = 'suffixes';
        } else if(activeModTab === 'suffixes' && suffixMods.length === 0 && prefixMods.length > 0){
          activeModTab = 'prefixes';
        }
      }

      function groupAndSortMods(mods){
        const modsGrouped = {};
        for(const entry of mods){
          const modType = getModGroupKey(entry.mod);
          if(!modsGrouped[modType]) modsGrouped[modType] = [];
          modsGrouped[modType].push(entry);
        }

        for(const modType in modsGrouped){
          modsGrouped[modType].sort((a, b) => {
            const aText = a.mod.text || '';
            const bText = b.mod.text || '';
            const aNumbers = (aText.match(/\d+/g) || []).map(Number);
            const bNumbers = (bText.match(/\d+/g) || []).map(Number);
            const aMax = aNumbers.length > 0 ? Math.max(...aNumbers) : 0;
            const bMax = bNumbers.length > 0 ? Math.max(...bNumbers) : 0;
            return bMax - aMax;
          });
        }
        return modsGrouped;
      }

      function renderModsSection(mods, sectionTitle){
        const isPrefix = sectionTitle === 'PREFIXES';
        const typeKey = isPrefix ? 'prefixes' : 'suffixes';
        const isClusterSubtypeView = Boolean(selectedClusterSubtype);
        
        let html = '<div class="mods-column">';
        
        if(mods.length > 0){
          const clusterNotables = isClusterSubtypeView
            ? mods.filter(({mod}) => /^1 Added Passive Skill is /.test(mod.text || ''))
            : [];
          const tieredMods = clusterNotables.length
            ? mods.filter(({mod}) => !/^1 Added Passive Skill is /.test(mod.text || ''))
            : mods;
          const modsGrouped = groupAndSortMods(tieredMods);
          const renderModCard = (mod, modType, tierLabel = '', showLocality = false) => {
            const isSelected = selectedMods[typeKey][modType] && selectedMods[typeKey][modType].id === mod.id;
            const isFull = Object.keys(selectedMods[typeKey]).length >= 3;
            const canSelect = isSelected || !isFull;
            const isEssenceOnly = mod.is_essence_only === true;
            const modDisplay = (tierLabel ? tierLabel + ': ' : '') + (mod.text || '') + (mod.name ? ' ('+mod.name+')' : '');
            const essenceLabel = isEssenceOnly ? '<span style="font-size:0.75em;color:var(--muted);margin-left:4px">(Essence)</span>' : '';
            return '<div class="mod-card'+(isSelected ? ' is-selected' : '')+'" style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.8em">' +
              '<div class="mod-card-text" style="flex:1">'+(showLocality ? renderModLocality(mod) + ' ' : '')+escapeHtml(modDisplay)+essenceLabel+'</div>' +
              '<button class="mod-select-btn'+(isSelected ? ' is-selected' : '')+'" data-mod-id="'+escapeHtml(mod.id)+'" data-mod-type="'+escapeHtml(modType)+'" data-mod-name="'+escapeHtml(mod.name)+'" data-is-prefix="'+isPrefix+'" aria-pressed="'+isSelected+'" style="padding:4px 8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:'+(canSelect?'pointer':'not-allowed')+';border-radius:4px;white-space:nowrap;opacity:'+(canSelect?'1':'0.5')+';min-width:32px">' +
              (isSelected ? '−' : '+') +
              '</button></div>';
          };
          if(clusterNotables.length){
            html += '<section class="cluster-notables" aria-label="Cluster notables">' +
              '<h3 class="cluster-notables-title">Notables ('+clusterNotables.length+')</h3>' +
              '<div class="cluster-notables-list">' +
              clusterNotables.map(({mod}) => renderModCard(mod, getModGroupKey(mod), '', true)).join('') +
              '</div></section>';
          }
          const modTypes = Object.keys(modsGrouped).sort();
          
          for(const modType of modTypes){
            const group = modsGrouped[modType];
            const groupId = 'mod-group-' + escapeHtml(sectionTitle + '_' + modType).replace(/[^\w-]/g, '_');
            const stateKey = getModGroupStateKey(selectedItem.id, sectionTitle, modType);
            const isOpen = openModGroups.get(stateKey) === true;
            html += '<div class="mod-group"><div class="mod-group-header" role="button" tabindex="0" aria-expanded="' +
              isOpen + '" data-group-id="'+groupId+'" data-base-id="'+escapeHtml(selectedItem.id)+'" data-section-title="'+sectionTitle+'" data-mod-type="' +
              escapeHtml(modType) + '">';
            html += '<span class="mod-group-toggle">'+(isOpen ? '▼' : '▶')+'</span>';
            html += '<span class="mod-group-name">'+escapeHtml(modType)+'</span>';
            html += '<span class="mod-group-count">'+group.length+'</span>';
            html += renderModLocality(group.map(({mod}) => mod));
            html += '</div><div class="mod-group-content" id="'+groupId+'" style="display:'+(isOpen ? 'block' : 'none')+'">';
            
            for(let tierIdx = 0; tierIdx < group.length; tierIdx++){
              const {mod} = group[tierIdx];
              const tierLabel = group.length > 1 ? 'T'+(tierIdx+1) : '';
              html += renderModCard(mod, modType, tierLabel);
            }
            html += '</div></div>';
          }
        }
        html += '</div>';
        return html;
      }

      let modsHtml = '';
      
      if(matchedMods.length === 0){
        modsHtml = clusterSubtypeHtml;
      } else {
        modsHtml += clusterSubtypeHtml +
          '<div class="mod-tag-filter-row">' +
          '<span>Tags</span>' +
          modTagOptions.map(([tag, count]) =>
            '<button class="mod-tag-filter-toggle" type="button" data-mod-tag="' + escapeHtml(tag) +
            '" aria-pressed="' + activeModTagFilters.has(tag) + '"' +
            (!compatibleModTags.has(tag) ? ' disabled' : '') + '>' +
            escapeHtml(tag) + '<span class="mod-tag-filter-count">' + count +
            '</span></button>'
          ).join('') +
          '<button class="mod-tag-filter-clear" type="button"' +
          (activeModTagFilters.size === 0 ? ' disabled' : '') + '>Clear</button>' +
          '</div>' +
          '<div class="mod-tabs" role="tablist" aria-label="Modifier type">' +
          '<button class="mod-tab" id="prefixes-tab" type="button" role="tab" data-mod-tab="prefixes" aria-controls="prefixes-panel" aria-selected="' + (activeModTab === 'prefixes') + '" tabindex="' + (activeModTab === 'prefixes' ? '0' : '-1') + '">Prefixes (' + prefixMods.length + ')</button>' +
          '<button class="mod-tab" id="suffixes-tab" type="button" role="tab" data-mod-tab="suffixes" aria-controls="suffixes-panel" aria-selected="' + (activeModTab === 'suffixes') + '" tabindex="' + (activeModTab === 'suffixes' ? '0' : '-1') + '">Suffixes (' + suffixMods.length + ')</button>' +
          '</div>' +
          '<div class="mod-tab-panel" id="prefixes-panel" role="tabpanel" aria-labelledby="prefixes-tab" ' + (activeModTab === 'prefixes' ? '' : 'hidden') + '>' +
          renderModsSection(prefixMods, 'PREFIXES') +
          '</div>' +
          '<div class="mod-tab-panel" id="suffixes-panel" role="tabpanel" aria-labelledby="suffixes-tab" ' + (activeModTab === 'suffixes' ? '' : 'hidden') + '>' +
          renderModsSection(suffixMods, 'SUFFIXES') +
          '</div>';
      }

      document.getElementById('mods-container').innerHTML = modsHtml;

      const modTabs = Array.from(document.querySelectorAll('.mod-tab'));
      const activateModTab = tab => {
        activeModTab = tab.dataset.modTab;
        for(const button of modTabs){
          const isActive = button === tab;
          button.setAttribute('aria-selected', String(isActive));
          button.tabIndex = isActive ? 0 : -1;
          document.getElementById(button.getAttribute('aria-controls')).hidden = !isActive;
        }
      };
      modTabs.forEach((tab, index) => {
        tab.addEventListener('click', () => activateModTab(tab));
        tab.addEventListener('keydown', event => {
          let nextIndex;
          if(event.key === 'ArrowRight') nextIndex = (index + 1) % modTabs.length;
          else if(event.key === 'ArrowLeft') nextIndex = (index - 1 + modTabs.length) % modTabs.length;
          else if(event.key === 'Home') nextIndex = 0;
          else if(event.key === 'End') nextIndex = modTabs.length - 1;
          else return;
          event.preventDefault();
          modTabs[nextIndex].focus();
          activateModTab(modTabs[nextIndex]);
        });
      });

      document.querySelectorAll('.mod-tag-filter-toggle').forEach(button => {
        button.addEventListener('click', () => {
          const tag = button.dataset.modTag;
          if(activeModTagFilters.has(tag)) activeModTagFilters.delete(tag);
          else if(compatibleModTags.has(tag)) activeModTagFilters.add(tag);
          else return;
          renderMods();
          const restoredButton = Array.from(document.querySelectorAll('.mod-tag-filter-toggle'))
            .find(option => option.dataset.modTag === tag);
          if(restoredButton) restoredButton.focus();
        });
      });
      const clearModTagFilters = document.querySelector('.mod-tag-filter-clear');
      if(clearModTagFilters){
        clearModTagFilters.addEventListener('click', () => {
          activeModTagFilters.clear();
          renderMods();
          const firstTagButton = document.querySelector('.mod-tag-filter-toggle');
          if(firstTagButton) firstTagButton.focus();
        });
      }

      document.querySelectorAll('.cluster-subtype-toggle').forEach(button => {
        button.addEventListener('click', () => {
          activeClusterSubtypeId = activeClusterSubtypeId === button.dataset.clusterSubtype
            ? null
            : button.dataset.clusterSubtype;
          renderMods();
          const restoredButton = Array.from(document.querySelectorAll('.cluster-subtype-toggle'))
            .find(option => option.dataset.clusterSubtype === button.dataset.clusterSubtype);
          if(restoredButton) restoredButton.focus();
        });
      });

      // Event listeners for mod groups
      document.querySelectorAll('.mod-group-header').forEach(header => {
        const toggleGroup = () => {
          const groupId = header.dataset.groupId;
          const content = document.getElementById(groupId);
          const toggle = header.querySelector('.mod-group-toggle');
          const isVisible = content.style.display !== 'none';
          content.style.display = isVisible ? 'none' : 'block';
          toggle.textContent = isVisible ? '▶' : '▼';
          header.setAttribute('aria-expanded', String(!isVisible));
          openModGroups.set(
            getModGroupStateKey(header.dataset.baseId, header.dataset.sectionTitle, header.dataset.modType),
            !isVisible
          );
        };
        header.addEventListener('click', toggleGroup);
        header.addEventListener('keydown', event => {
          if(event.key === 'Enter' || event.key === ' '){
            event.preventDefault();
            toggleGroup();
          }
        });
      });

      // Event listeners for mod selection buttons
      document.querySelectorAll('.mod-select-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const modId = btn.dataset.modId;
          const modType = btn.dataset.modType;
          const modName = btn.dataset.modName;
          const isPrefix = btn.dataset.isPrefix === 'true';
          const typeKey = isPrefix ? 'prefixes' : 'suffixes';

          // Find the full mod object
          const mod = allMods.find(m => m.id === modId);
          
          // Check if already selected
          if(selectedMods[typeKey][modType] && selectedMods[typeKey][modType].id === modId){
            // Deselect
            delete selectedMods[typeKey][modType];
          } else {
            // Check if can select (max 3 per type)
            if(Object.keys(selectedMods[typeKey]).length >= 3 && !selectedMods[typeKey][modType]){
              const selectionNotice = document.getElementById('mod-selection-notice');
              selectionNotice.textContent = 'Maximum 3 ' + (isPrefix ? 'prefixes' : 'suffixes') + '.';
              selectionNotice.hidden = false;
              return;
            }
            // Select (replace if group already has a selection)
            selectedMods[typeKey][modType] = mod;
          }
          
          renderMods();
          renderSelectedModsPanel();
          renderModCalculations();
          render();
        });
      });
    }

    function calculateModEffects(){
      if(!selectedItem) return null;
      
      const baseStats = {
        physical_damage_min: null,
        physical_damage_max: null,
        armour: null,
        evasion: null,
        energy_shield: null
      };
      
      // Extract base values from item properties, with quality applied
      if(selectedItem.properties){
        if(selectedItem.properties.physical_damage_min !== undefined) 
          baseStats.physical_damage_min = Number(applyQuality('physical_damage', selectedItem.properties.physical_damage_min)) || 0;
        if(selectedItem.properties.physical_damage_max !== undefined) 
          baseStats.physical_damage_max = Number(applyQuality('physical_damage', selectedItem.properties.physical_damage_max)) || 0;
        if(selectedItem.properties.armour !== undefined) 
          baseStats.armour = Number(applyQuality('armour', selectedItem.properties.armour)) || 0;
        if(selectedItem.properties.evasion !== undefined) 
          baseStats.evasion = Number(applyQuality('evasion', selectedItem.properties.evasion)) || 0;
        if(selectedItem.properties.energy_shield !== undefined) 
          baseStats.energy_shield = Number(applyQuality('energy_shield', selectedItem.properties.energy_shield)) || 0;
      }
      
      // Accumulate flat and percentage bonuses from selected mods
      const flatBonuses = {
        armour: 0,
        evasion: 0,
        energy_shield: 0
      };
      
      const percentBonuses = {
        armour: 0,
        evasion: 0,
        energy_shield: 0
      };
      
      const allSelectedMods = {...selectedMods.prefixes, ...selectedMods.suffixes};
      
      for(const modType in allSelectedMods){
        const mod = allSelectedMods[modType];
        const modText = mod.text || '';
        
        // Extract flat armour
        const armourMatch = modText.match(/\+(\d+)\s+to\s+Armour/i);
        if(armourMatch){
          flatBonuses.armour += Number(armourMatch[1]);
        }
        
        // Extract increased armour
        let increaseArmourMatch = modText.match(/\((\d+)-(\d+)\)%\s+(?:more|increased)\s+Armour/i);
        if(!increaseArmourMatch) increaseArmourMatch = modText.match(/(\d+)(?:-(\d+))?%\s+(?:more|increased)\s+Armour/i);
        if(increaseArmourMatch){
          const percentValue = increaseArmourMatch[2] ? Number(increaseArmourMatch[2]) : Number(increaseArmourMatch[1]);
          percentBonuses.armour += percentValue;
        }
        
        // Extract flat evasion
        const evasionMatch = modText.match(/\+(\d+)\s+to\s+Evasion Rating/i);
        if(evasionMatch){
          flatBonuses.evasion += Number(evasionMatch[1]);
        }
        
        // Extract increased evasion
        let increaseEvasionMatch = modText.match(/\((\d+)-(\d+)\)%\s+(?:more|increased)\s+Evasion Rating/i);
        if(!increaseEvasionMatch) increaseEvasionMatch = modText.match(/(\d+)(?:-(\d+))?%\s+(?:more|increased)\s+Evasion Rating/i);
        if(increaseEvasionMatch){
          const percentValue = increaseEvasionMatch[2] ? Number(increaseEvasionMatch[2]) : Number(increaseEvasionMatch[1]);
          percentBonuses.evasion += percentValue;
        }
        
        // Extract flat energy shield
        const esMatch = modText.match(/\+(\d+)\s+to\s+(?:maximum\s+)?Energy Shield/i);
        if(esMatch){
          flatBonuses.energy_shield += Number(esMatch[1]);
        }
        
        // Extract increased energy shield
        let increaseESMatch = modText.match(/\((\d+)-(\d+)\)%\s+(?:more|increased)\s+(?:maximum\s+)?Energy Shield/i);
        if(!increaseESMatch) increaseESMatch = modText.match(/(\d+)(?:-(\d+))?%\s+(?:more|increased)\s+(?:maximum\s+)?Energy Shield/i);
        if(increaseESMatch){
          const percentValue = increaseESMatch[2] ? Number(increaseESMatch[2]) : Number(increaseESMatch[1]);
          percentBonuses.energy_shield += percentValue;
        }
      }
      
      // Calculate final values: base + flat, then apply percentage
      const finalStats = {};
      
      // Armour - apply even if base is null
      if(flatBonuses.armour > 0 || percentBonuses.armour > 0 || baseStats.armour){
        let val = (baseStats.armour || 0) + flatBonuses.armour;
        val = Math.round(val * (1 + percentBonuses.armour / 100));
        finalStats.armour = val;
      }
      
      // Evasion - apply even if base is null
      if(flatBonuses.evasion > 0 || percentBonuses.evasion > 0 || baseStats.evasion){
        let val = (baseStats.evasion || 0) + flatBonuses.evasion;
        val = Math.round(val * (1 + percentBonuses.evasion / 100));
        finalStats.evasion = val;
      }
      
      // Energy Shield - apply even if base is null
      if(flatBonuses.energy_shield > 0 || percentBonuses.energy_shield > 0 || baseStats.energy_shield){
        let val = (baseStats.energy_shield || 0) + flatBonuses.energy_shield;
        val = Math.round(val * (1 + percentBonuses.energy_shield / 100));
        finalStats.energy_shield = val;
      }
      
      return { baseStats, finalStats, flatBonuses, percentBonuses };
    }

    function updateSelectedRowWithCalculations(){
      if(!selectedItem){
        return;
      }
      
      const calc = calculateModEffects();
      if(!calc){
        return;
      }
      
      const hasSelectedMods = Object.keys(selectedMods.prefixes).length > 0 || Object.keys(selectedMods.suffixes).length > 0;
      
      if(!hasSelectedMods){
        // Reset to base values
        const selectedRow = document.querySelector('#table-results table.results tbody tr.selected');
        if(selectedRow){
          const cells = Array.from(selectedRow.cells);
          cells.forEach(cell => {
            cell.style.backgroundColor = '';
            cell.style.fontWeight = '';
          });
        }
        return;
      }
      
      const { baseStats, finalStats } = calc;
      const selectedRow = document.querySelector('#table-results table.results tbody tr.selected');
      if(!selectedRow) return;
      
      const table = document.querySelector('#table-results table.results');
      if(!table) return;
      
      // Find all header rows and build accurate column map
      const headerRows = Array.from(table.querySelectorAll('thead tr'));
      const bodyCells = Array.from(selectedRow.cells);
      
      // Create a more robust column map
      const columnMap = {};
      let cellIndex = 0;
      
      for(let rowIdx = 0; rowIdx < headerRows.length; rowIdx++){
        const row = headerRows[rowIdx];
        const cells = Array.from(row.cells);
        
        for(let cellIdx = 0; cellIdx < cells.length; cellIdx++){
          const cell = cells[cellIdx];
          const key = cell.getAttribute('data-key') || '';
          const colspan = parseInt(cell.getAttribute('colspan')) || 1;
          
          // Record this cell's column span
          if(key){
            // Store all indices this key spans
            for(let c = 0; c < colspan; c++){
              columnMap[key + '_' + c] = cellIndex + c;
            }
            // Also store the first index
            columnMap[key] = cellIndex;
          }
          cellIndex += colspan;
        }
      }
      
      console.log('Column map keys:', Object.keys(columnMap).filter(k => k.includes('physical_damage')));
      
      // Helper to find column index for a property
      const findColumnIndex = (propName) => {
        // Look for exact match first
        for(const key in columnMap){
          if(key.includes(propName) && !key.endsWith('_0') && !key.endsWith('_1')){
            return columnMap[key];
          }
        }
        return undefined;
      };
      
      // Reset all cells first
      bodyCells.forEach(cell => {
        cell.style.backgroundColor = '';
        cell.style.fontWeight = '';
      });
      
      // Update armour
      if(finalStats.armour !== undefined){
        const armIdx = findColumnIndex('armour');
        if(armIdx !== undefined && armIdx >= 0 && armIdx < bodyCells.length){
          bodyCells[armIdx].textContent = finalStats.armour;
          bodyCells[armIdx].style.backgroundColor = 'rgba(34, 139, 34, 0.25)';
          bodyCells[armIdx].style.fontWeight = '600';
        }
      }
      
      // Update evasion
      if(finalStats.evasion !== undefined){
        const evasIdx = findColumnIndex('evasion');
        if(evasIdx !== undefined && evasIdx >= 0 && evasIdx < bodyCells.length){
          bodyCells[evasIdx].textContent = finalStats.evasion;
          bodyCells[evasIdx].style.backgroundColor = 'rgba(34, 139, 34, 0.25)';
          bodyCells[evasIdx].style.fontWeight = '600';
        }
      }
      
      // Update energy shield
      if(finalStats.energy_shield !== undefined){
        const esIdx = findColumnIndex('energy_shield');
        if(esIdx !== undefined && esIdx >= 0 && esIdx < bodyCells.length){
          bodyCells[esIdx].textContent = finalStats.energy_shield;
          bodyCells[esIdx].style.backgroundColor = 'rgba(34, 139, 34, 0.25)';
          bodyCells[esIdx].style.fontWeight = '600';
        }
      }
    }

    function renderModCalculations(){
      if(!selectedItem){
        document.getElementById('mod-calculations').style.display = 'none';
        return;
      }
      
      const calc = calculateModEffects();
      if(!calc){
        document.getElementById('mod-calculations').style.display = 'none';
        return;
      }
      
      const hasSelectedMods = Object.keys(selectedMods.prefixes).length > 0 || Object.keys(selectedMods.suffixes).length > 0;
      
      if(!hasSelectedMods){
        document.getElementById('mod-calculations').style.display = 'none';
        return;
      }
      
      const { baseStats, finalStats } = calc;
      let html = '';
      
      // Physical damage
      const physicalMinRange = calculatePhysicalDamageRange(selectedItem, 'min');
      const physicalMaxRange = calculatePhysicalDamageRange(selectedItem, 'max');
      if(physicalMinRange && physicalMaxRange){
        const baseMin = baseStats.physical_damage_min || 0;
        const baseMax = baseStats.physical_damage_max || 0;
        const finalMin = physicalMinRange.max === physicalMinRange.min
          ? String(physicalMinRange.min)
          : physicalMinRange.max + '-' + physicalMinRange.min;
        const finalMax = physicalMaxRange.max === physicalMaxRange.min
          ? String(physicalMaxRange.min)
          : physicalMaxRange.max + '-' + physicalMaxRange.min;
        const changed = physicalMinRange.min !== baseMin || physicalMinRange.max !== baseMin ||
          physicalMaxRange.min !== baseMax || physicalMaxRange.max !== baseMax;
        if(changed){
          html += '<div style="color:var(--match);font-weight:600">Physical Damage: <span style="text-decoration:line-through">'+baseMin+'-'+baseMax+'</span> → '+finalMin+' to '+finalMax+'</div>';
        }
      }
      
      // Armour
      if(finalStats.armour !== undefined){
        const baseVal = baseStats.armour || 0;
        const finalVal = finalStats.armour;
        const changed = finalVal !== baseVal;
        if(changed){
          html += '<div style="'+(changed?'color:var(--match);font-weight:600':'')+'">Armour: <span style="text-decoration:line-through">'+baseVal+'</span> → '+finalVal+'</div>';
        }
      }
      
      // Evasion
      if(finalStats.evasion !== undefined){
        const baseVal = baseStats.evasion || 0;
        const finalVal = finalStats.evasion;
        const changed = finalVal !== baseVal;
        if(changed){
          html += '<div style="'+(changed?'color:var(--match);font-weight:600':'')+'">Evasion: <span style="text-decoration:line-through">'+baseVal+'</span> → '+finalVal+'</div>';
        }
      }
      
      // Energy Shield
      if(finalStats.energy_shield !== undefined){
        const baseVal = baseStats.energy_shield || 0;
        const finalVal = finalStats.energy_shield;
        const changed = finalVal !== baseVal;
        if(changed){
          html += '<div style="'+(changed?'color:var(--match);font-weight:600':'')+'">Energy Shield: <span style="text-decoration:line-through">'+baseVal+'</span> → '+finalVal+'</div>';
        }
      }
      
      if(html){
        document.getElementById('mod-calcs-content').innerHTML = html;
        document.getElementById('mod-calculations').style.display = 'block';
      } else {
        document.getElementById('mod-calculations').style.display = 'none';
      }
      
      updateSelectedRowWithCalculations();
    }

    function renderSelectedModsPanel(){
      const renderList = (typeKey, prefix) => {
        const list = document.getElementById('selected-' + typeKey + '-list');
        const count = Object.keys(selectedMods[typeKey]).length;
        const countEl = document.getElementById('selected-' + typeKey + '-count');
        if(countEl) countEl.textContent = prefix + ' (' + count + '/3)';
        
        let html = '';
        for(const modType in selectedMods[typeKey]){
          const mod = selectedMods[typeKey][modType];
          html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;background:rgba(0,0,0,0.05);border-radius:4px;border-left:3px solid var(--accent)">';
          html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:0.85em">'+renderModLocality([mod])+' '+escapeHtml(mod.name)+'</div>';
          html += '<div style="font-size:0.75em;color:var(--muted)">'+escapeHtml(modType)+'</div></div>';
          html += '<button class="mod-remove-btn" data-mod-type="'+escapeHtml(modType)+'" data-is-prefix="'+(typeKey==='prefixes')+'" style="margin-left:8px;padding:2px 6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;border-radius:3px;font-size:0.8em">−</button>';
          html += '</div>';
        }
        list.innerHTML = html;
        
        // Add remove button listeners
        list.querySelectorAll('.mod-remove-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const modType = btn.dataset.modType;
            const isPrefix = btn.dataset.isPrefix === 'true';
            const typeKey = isPrefix ? 'prefixes' : 'suffixes';
            delete selectedMods[typeKey][modType];
            renderMods();
            renderSelectedModsPanel();
            render();
            renderModCalculations();
          });
        });
      };
      
      renderList('prefixes', 'Prefixes');
      renderList('suffixes', 'Suffixes');
      renderModCalculations();
    }

    function escapeHtml(s){
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    load();
  </script>
</body>
</html>
